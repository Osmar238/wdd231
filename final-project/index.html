<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <header>
        <div class="logo">SmartPlate</div>
        <button id="menu-btn" aria-label="Open menu">☰</button>

            <a href="search.html">Search Recipes</a>
